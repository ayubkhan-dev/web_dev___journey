<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            width: 100px;
            height: 50px;
            background-color: aquamarine;
            position: relative;
        }

        #box2{
            width: 100px;
            height: 50px;
            background-color: aquamarine;
            position: relative;
        }
    </style>
</head>
<body>
    <h1>jquery Animate method</h1>
    <div id="box">
        <h3>yahoo <br>baba</h3>
    </div>
    <button id="animate">Animate</button>


     <h1>jquery Animate method</h1>
    <div id="box2">
        <h3>Ayub<br>khan</h3>
    </div>
    <button id="animate2">Animate</button>


      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      <script>
        $(document).ready(function(){
            $('#animate').click(function(){
                $('#box').animate({
                    left:"200px",
                    width:"200px",
                    height:"200px",
                });
            });

            $('#animate2').click(function(){
                $('#box2').animate({left:'500px'});
                $('#box2').animate({top:'200px'});
                $('#box2').animate({left:'-1px'});
                $('#box2').animate({top:'-1px'});

            });
        });
      </script>
</body>
</html>
