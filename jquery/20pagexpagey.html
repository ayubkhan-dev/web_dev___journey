<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #result{
        width: 300px;
        height: 300px;
        background-color: aquamarine;

    }
    .box{
        width: 100px;
        height: 100px;
        background-color: rgb(235, 13, 13);
        border-radius: 100%;
    }
</style>
<body>
    <h2>jquery pageX and pageY method</h2>

    
     <div id="result"></div>

     <div class="box"></div>
    
    
    
     <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
     <script>
        $(document).ready(function(){
            $(document).mousemove(function(event){
                $('#result').text("X:" + event.pageX + " Y: " + event.pageY);

                var x = event.pageX;
                var y = event.pageY;


                $('.box').offset({top:y,left:x});



            });
        });
     </script>
</body>
</html>
