<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
   <h1 id="hello">this is jqurery clik heading</h1>
   <h2 class="hello1">thsi is jqurery click heading two</h2>
   <h3>thsi is jqurery click heading three</h3>

        $('h3').click(function(){

    });
   </script>


 
</body>
