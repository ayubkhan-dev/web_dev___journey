<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>jquery each() method</h2>
    <ul type="circle">
        <li>orange</li>
        <li>apple</li>
        <li>banana</li>
        <li>grapes</li>
    </ul>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      <script>
        $(document).ready(function(){
            $('li').each(function(){
                
                alert($('li').text());
            });
        });
      </script>
</body>
</html>
