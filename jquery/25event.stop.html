<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        width: 300px;
        height: 300px;
        background-color: aquamarine;
    }
</style>
<body>
    <h1>jquery event.stop property</h1>

    <div class="box">

    <h2>test box</h2>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quo hic veritatis magni harum dolor nesciunt nemo sit consectetur, quidem sunt repellendus quam, facilis, nam in? Nulla aspernatur reprehenderit labore odit?</p>

    <button> button</button>
    </div>

     <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
     <script>
        $(document).ready(function(){
            $('.box').click(function(){
                alert("the div element was clicked");
            });

            $('h2').click(function(event){
                event.stopPropagation();
                alert("the h2 element was clicked");
            });

            $('p').click(function(event){
                 event.stopPropagation();
                alert("the p element was clicked" + ":" +event.isPropagationStopped());
            });

            $('button').click(function(){
                alert("the button element was clicked");
            });

        });
     </script>
</body>
</html>
