<div id="box1" style="width:200px;height:200px;background:blue;">

</div>

<script>
    var a = document.querySelector('#box1');
    a.addEventListener('click', function (e) {
      

        var b = e. ctrlKey; //altKey shiftKey
        if (b) {
            document.write('You pressed Control key');
        } else {
            document.write('You did not press Control key');
        }
    });                                                    
</script>
