<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //  what is string method 
    // first now that string mean  text and method mean what you work on text;
    // defination of string method :
    //                     it is a function used to perform difference operation of javascript text;

    var str = "this is a string method in javasript";
    var a=str.length;
    document.write(a + "<br>");

    var str = "this is a string method in javasript";
    var a=str.toUpperCase();
    document.write(a + "<br>");

     var str = "this is a string method in javasript";
    var a=str.toLowerCase();
    document.write(a + "<br>");

    var str = "this is a string method in javasript";
    var a=str.includes("is");
    document.write(a + "<br>");

    var str = "this is a string method in javasript";
    var a=str.startsWith("this");
    document.write(a + "<br>");

    var str = "this is a string method in javasript";
    var a=str.endsWith("this");
    document.write(a + "<br>");

     var str = "this is a string method in javasript";
    var a=str.search("is");
    document.write(a + "<br>");


     var str = "this is a string method in javasript";
    var a=str.indexOf("this");
    document.write(a + "<br>");



     var str = "this is a string method in javasript";
    var a=str.replace("a","are");
    document.write(a + "<br>");


     var str = "this is a string method in javasript";
    var a=str.endsWith("this");
    document.write(a + "<br>");


     var str = "this is a string method in javasript";
    var a=str.repeat(5);
    document.write(a + "<br>");

    </script>
    
</body>
</html>
