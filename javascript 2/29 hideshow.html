    <form action="">
        <fieldset>
            <legend>Login Form</legend>
            <label for="">Name</label><br>
            <input type="text" name="" id=""><br>

            <label for="">Password</label><br>
            <input type="password" name="" id="password"><br><br>

            <button>login</button>
            <button type="button" onclick="toggle(this)">show passsowrd</button>
        </fieldset>
    </form>


    <script>
        var global = document.getElementById('password');

        function toggle(elem){
            var a =global.getAttribute('type');
            if(a === 'password'){
                global.setAttribute('type','text');
                elem.innerText = "Hide password";
            }else{
                global.setAttribute('type','password');
                elem.innerText="show password";
            }
        }
