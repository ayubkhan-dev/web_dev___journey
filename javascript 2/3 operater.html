<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 id="result" style="text-align: center; font-size: large;"></h1>

    <div class="div">
    
    </div>

    <script>
                    //    Artamitic operater

            var x = 10;
            var y = 3;
            var z =x+y;
            document.getElementById("result").innerHTML=z;


            var t=20;
            var e=100;
            var z=t-e;
            document.getElementsByClassName("div")[0].innerText=z;


                        // comparision operater 
            
            var a = 10;
            var b = 20;
            var c = a>b;
            document.getElementById("result").innerHTML=c;


            var a = 10;
            var b = 20;
            var c = a<b;
            document.getElementById("result").innerHTML=c;



                    // logical operater 
</script>
</body>
</html>
