    <input type="text" name="" id="input1" placeholder="enter first value">

    <select name="" id="operater">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
    </select>

    <input type="text" name="" id="input2" placeholder="enter 2nd value">
    <button onclick="cal()">calcute</button>
    <input type="text" name="" id="result" placeholder="Result" readonly>

    <script>
        function cal(){
            var a = document.getElementById('input1').value;
            var b = document.getElementById('input2').value;
            var c = document.getElementById('operater').value;
            if(c == '+'){
                var res = parseInt(a) + parseInt(b);
            }
            if(c == '-'){
                var res = parseInt(a) - parseInt(b);
            }
             if(c == '*'){
                var res = parseInt(a) * parseInt(b);
            }
             if(c == '/'){
                var res = parseInt(a) / parseInt(b);
            }
             if(c == '%'){
                var res = parseInt(a) % parseInt(b);
            }

            document.getElementById('result').value=res;




        }

    </script>
