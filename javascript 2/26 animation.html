    #child{
        width: 50px;
        height: 50px;
        background-color: red;
        position: absolute;
        top: 0px;
        left: 0px;
    }
</style>
<body>
    <button id="hello">clik me</button>
    <div id="main">

        </div>

        document.getElementById('hello').addEventListener('click',function(){
            var redelem = document.getElementById('child');

            var anim = setInterval(animate ,5);

            function animate(){
                if(poselem == 350){
                    clearInterval(anim);

                }else{

                    poselem++;
                    redelem.style.top=poselem + "px";
                    redelem.style.left = poselem + "px";   
                }

            }
        });
