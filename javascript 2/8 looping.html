<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
    // looping in javascript :

    //                 loop is used to repat block of code until the spacific task is met .
    //                 loop is rapat simler task again and again.
    //                 it is clean and save alot of time and reusable.

    var a=1;
    while (a<=10){
        document.write(a +"<br>");
        a=a+1;
    }

    var hello = 0;
    while (hello < 5){
        document.write(hello);
        hello=hello+1;
    }
    document.write("<br>")

    var z=10;
    while (z<=20){
        document.write(z);
        z=z+1;
    }

    var y = 1;
    while (y<=10){
        document.write("hello");
        y=y+1;
    }

    document.write("<hr>");
    

    var a=1;
    do{
        document.write("hello every one");
        a++;
    }
    while(a<=10);



    var c=0;
    do{
        document.write(c + "<br>");
        c++;
    }
    while(c<=10);


    var s =1;
    do{
        document.write("ali");
        s++;
    }while(s<=10);

    document.write("<hr>")


    for(var a=1;a<=10;a++){
        document.write(a + "<br>");
    }

    for(var a=0;a<=5; a++){
        document.write(a);
    }
    document.write("<br>");
    for(var a=1;a<=10;a++){
        document.write("ayub");
    }




</script>
</body>
</html>
