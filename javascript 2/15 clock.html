<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        font-size: 200px;
        text-align: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        background-color: black;
        color: white;
    }
</style>
<body onload="showtime()"> 
    <h1></h1>

    <script>
        function showtime(){
            var d = new Date();
            var h = d.getHours();
            var m = d.getMinutes();
            var s = d.getSeconds();
            var section = "AM";

            if(h>12){
                h=h-12;
                //13-12=01
            }
            if(h>=12){
                section = "PM";
            }


            h=h<10 ? "0"+h:h;
            m= m<10 ? "0"+m:m;
            s = s<10 ? "0"+s :s;


            var time= h + ":" + m + ":" + s + " " + section;
            document.getElementsByTagName('h1')[0].innerText=time;

            setTimeout(showtime,1000);
        }
    </script>
</body>
</html>
