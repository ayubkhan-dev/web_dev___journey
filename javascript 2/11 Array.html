                                                        //Methods of array
         
             var name=["wali","saifoor","samood","masood","Ayub"];

             function sort(){
                    var a=["wali","saifoor","samood","masood","Ayub"];
             a.sort();
             document.getElementById('btn').innerHTML=a;

             }

             function reverse(){
                var b =["wali","saifoor","samood","masood","Ayub"];
                b.reverse();
                document.getElementById('btn').innerHTML=b.reverse();
             }

           function pop(){
               var name=["wali","saifoor","samood","masood","Ayub"];
               var demo=name;
               demo.pop();
               document.getElementById('btn').innerHTML=demo;

           }

           function push(){
             var name=["wali","saifoor","samood","masood","Ayub"];
             var demo=name;
             demo.push("ali");
             document.getElementById('btn').innerHTML=demo;
           }

           function shift(){
             var name=["wali","saifoor","samood","masood","Ayub"];
             name.shift();
             document.getElementById('btn').innerHTML=name;
           }
           

           function unshift(){
             var name=["wali","saifoor","samood","masood","Ayub"];
             name.unshift("arslan");
             document.getElementById("btn").innerHTML=name;
           }

           function concate(){
             var name=["wali","saifoor","samood","masood","Ayub"];
             var hello=["wali","saifoor","samood","masood","Ayub"];
            var demo= name.concat(hello);
             document.getElementById("btn").innerHTML=demo;
           }

           function index(){

           }

            function includes(){
