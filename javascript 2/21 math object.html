<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 

                                    <!-- Math object Mathods -->

<script>
  var a = Math.PI;
  document.write(a + "<br>");
  var b = Math.pow(2,2);
  document.write(b + "<br>");
  var c = Math.round(2.4);
  document.write(c + "<br>");
  var d = Math.sqrt(10);
  document.write(d + "<br>");
  var e = Math.abs(-20);
  document.write(e + "<br>");
  var f = Math.ceil(3.4);
  document.write(f + "<br>");
  var g = Math.floor(3.9);
  document.write(g + "<br>");
  var h = Math.min(2,5,9);
  document.write(h + "<br>");
  var i = Math.max(19,5,50);
  document.write(i + "<br>");
  var j = Math.random()*1000000;
  document.write(Math.round(j));
</script>





    
</body>
</html>
