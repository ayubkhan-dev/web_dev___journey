<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="openwin()">open window</button>
    <button onclick="closewin()">close window</button>


    <script>
        var win;

        function openwin(){
           win =  window.open("https://www.youtube.com" , "width=200px","height = 100px");
        }

         function closewin() {
        if (win && !win.closed) {
            win.close();
        }
    }
    </script>
</body>
</html>
