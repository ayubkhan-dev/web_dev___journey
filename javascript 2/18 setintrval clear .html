<body>
    
        <button onclick="start()">set intrval</button>
        <button onclick="stop()">clear intrval</button>


        <script>
                                                // set interval 
            var set;
            function start(){
                set = setInterval(function(){
                    alert("set interval");
                },3000);
            }
                                              //  clerar interval 
            function stop(){
                clearInterval(set);
                alert("stop");
            }
        </script>
