<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="start()">start</button>
    <button onclick="stop()">stop</button>
    

    <script>

                                                   // set time out 

        var set;
        function start(){

           set =  setTimeout(function(){
                document.write("Ayub khan");
            },
            3000
        );

        }

                                                                // clear time out 

        function stop(){
            clearTimeout(set);
            document.write("stopt ")

        }
    </script>
</body>
</html>
