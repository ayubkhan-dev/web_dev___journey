<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        width: 800px;
        display: grid;
        grid-template-columns: 200px 200px 200px;
        grid-template-rows: 200px 200px;

    }
    .item1{
        background-color: antiquewhite;
        grid-row-start: 2;
        grid-row-end: 3;
        grid-column-start: 3;
        grid-column-end: 4;

        /* grid-row: 2 / 3;
        grid-column: 3/4; */

    }
    .item2{
        background-color: rgb(86, 219, 15);
    }
    .item3{
        background-color: rgb(237, 4, 4);
    }
    .item4{
        background-color: rgb(220, 130, 13);
    }
    .item5{
        background-color: rgb(212, 16, 160);
    }
    .item6{
        background-color: rgb(19, 174, 230);
        grid-row-start: 1;
        grid-column-start: 1;
    }

</style>

<body>
    <div class="container">
        <div class="items item1">ist</div>
        <div class="items item2">2nd</div>
        <div class="items item3">3rd</div>
        <div class="items item4">4th</div>
        <div class="items item5">5th</div>
        <div class="items item6">6th</div>
    </div>

</body>
</html>
