<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    

   
    .container{
        width: 800px;
        display: grid;
        grid-template-columns: 400px 400px;
        grid-template-rows: 200px 200px;
        grid-gap: 10px 10px;

    }
    .item1{
        background-color: rgb(83, 65, 42);

    }
    .item2{
        background-color: rgb(86, 219, 15);

        display: grid;
        grid-template-columns: 190px 200px;
        grid-template-rows: 80px 80px;
         grid-gap: 10px 10px;
    }
    .subitems{
        background-color: aqua;
       
    }
    .item3{
        background-color: rgb(237, 4, 4);
    }
    .item4{
        background-color: rgb(220, 130, 13);
    }

</style>

<body>
    <div class="container">
        <div class="items item1">Header</div>
        <div class="items item2">
            <div class="subitems">1</div>
            <div class="subitems">2</div>
            <div class="subitems">3</div>
            <div class="subitems">4</div>
        </div>
        <div class="items item3">Button</div>
        <div class="items item4">Button</div>

    </div>

</body>
</html>
