<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        color: aliceblue;
        font-weight: bold;
        text-align: center;
        padding: 10px;

    }
    .container{
        width: 700px;
         height: 500px;
        /* margin: 100px auto 0; */
        /* border: 1px solid red; */
        
        display: grid;
        grid-template-columns: 200px 200px 200px ;
        grid-template-rows: 50px 50px  50px;
        grid-gap: 10px 10px;

    }
    .item1{
        background-color: rgb(83, 65, 42);
        grid-row: 1/2;
        grid-column: 1/4;
    

    }
    .item2{
        background-color: rgb(86, 219, 15);
        grid-row: 2/3;
        grid-column: 1/4;
    }
    .item3{
        background-color: rgb(237, 4, 4);
    }
    .item4{
        background-color: rgb(220, 130, 13);
    }
    .item5{
        background-color: rgb(124, 96, 117);
        grid-row-start: 3;
        grid-row-end: 9;
        grid-column: 1/2;
    }
    .item6{
        background-color: rgb(19, 174, 230);
        grid-row: 4/9;
        grid-column: 2/4;
    }
     .item7{
        background-color: rgb(229, 6, 214);
        grid-row: 9;
        grid-column: 1/4 ;
    }

</style>

<body>
    <div class="container">
        <div class="items item1">Header</div>
        <div class="items item2">menu</div>
        <div class="items item3">Button</div>
        <div class="items item4">Button</div>
        <div class="items item5">sidebar</div>
        <div class="items item6">content</div>
        <div class="items item7">Footer</div>
    </div>

</body>
</html>
