    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border: 3px solid black;
        width: 600px;
        
        display: flex;
        flex-wrap: wrap;
        

        
       
        
    }
    .item1{background-color: rgb(22, 246, 197);}
     .item2{background-color: rgb(235, 53, 7);flex-basis: 200px;}
     .item3{background-color: rgb(47, 255, 0);}
     .item4{background-color: rgb(20, 44, 223);}

    .items{
        font-size: 20px;
        text-align: center;
        padding: 10px;
        margin: 0px;
         flex-basis: 100px;
       
    }
</style>
<body>
    <h1>Ayub khan : css flex-basis </h1>
    <!-- it is used for like max-width in countainer-->
    <div class="container">
        <div class="items item1">one</div>
        <div class="items item2">two</div>
        <div class="items item3">three</div>
        <div class="items item4">four</div>
  
    </div>
</body>

</body>
