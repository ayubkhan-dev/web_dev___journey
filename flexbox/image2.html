<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        text-align: center;
    }
    .box{
        position: relative;
        width: 400px;
        /* border: 1px solid red; */
        margin: auto;
    }
    .box .box-pic{
      position: relative;
      transform-origin: 95% 50% 0;
      z-index:1 ;
    }
    .box .box-pic img{
        width: 400px;
        height: 400px;
        border-radius: 50%;
    }
    .box:hover .box-pic{
        transform: rotate(-140deg);
        transition: all 0.5s;
    }
    .box-content{
        position: absolute;
        top: 0%;
        left: 0%;
        width: 100%;
        height: 100%;
        background-color: brown;
        border-radius: 50%;
        padding: 70px ;
        box-sizing: border-box;
        color: aliceblue;
        font-weight: bold;
      
        
       
    }
</style>
<body>
    <h1>image rotaing card</h1>

    <div class="box">
        <div class="box-pic">
            <img src="photo/3.jpg" alt="" >
        </div>

        <div class="box-content">
            <h2>heading tag</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt natus quos neque ipsum modi molestias tempore nulla unde. Enim nostrum vel quisquam expedita magnam id quaerat culpa itaque nihil tempora.</p>
        </div>
    </div>
</body>
</html>
