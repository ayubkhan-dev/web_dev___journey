    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border: 3px solid black;
        width: 600px;
       
        
        
        display: flex;
        flex-direction: column;

        
    }
    .item1{background-color: rgb(22, 246, 197);}
     .item2{background-color: rgb(235, 53, 7); 
    display: flex;
}
.subitem{
    background-color: wheat;
    flex-grow: 1;
    margin: 5px;
}
     .item3{background-color: rgb(47, 255, 0);}

    .items{
        font-size: 20px;
        text-align: center;
        padding: 10px;
         height: 100px;
        
       
    }
</style>
<body>
    <h1>Ayub khan : css nested flexbox </h1>
    <!-- it is used for space in the items-->
    <div class="container">
        <div class="items item1">one</div>
        <div class="items item2">
            <div class="subitem">A</div>
            <div class="subitem">B</div>
            <div class="subitem">C</div>
        </div>
        <div class="items item3">three</div>
  
    </div>
</body>
