    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border: 3px solid black;
        margin: 50px;
        padding: 10px;
        height: 400px;
        
        display: flex;
        align-items:flex-start;
        /* stretch,flex-start,flex-end,center,baseline. */
        
    }
     .item1{background-color: aqua;}
     .item2{background-color: rgb(235, 53, 7);}
     .item3{background-color: rgb(47, 255, 0);}
     .item4{background-color: rgb(20, 44, 223);}
     .item5{background-color: rgb(209, 10, 156);}
     .item6{background-color: rgb(19, 231, 15);}

    .items{
        font-size: 20px;
        text-align: center;
        padding: 10px;
        margin: 5px;
    }
</style>
<body>
    <h1>Ayub khan : css align-items </h1>
    <!-- it is used is for when we set some thing in vertical aligment <|> -->
    <div class="container">
        <div class="items item1">one</div>
        <div class="items item2">two</div>
        <div class="items item3">three</div>
        <div class="items item4">four</div>
        <!-- <div class="items item5">five</div>
        <div class="items item6">six</div> -->
  
    </div>
</body>
