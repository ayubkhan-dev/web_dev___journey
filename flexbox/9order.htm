<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border: 3px solid black;
        margin: 50px;
        padding: 10px;
        
        display: flex;
        align-items: flex-start;
   
        
    }
    .item1{background-color: rgb(22, 246, 197); order: 1;}
     .item2{background-color: rgb(235, 53, 7); order: 2;}
     .item3{background-color: rgb(47, 255, 0);}
     .item4{background-color: rgb(20, 44, 223);}
     .item5{background-color: rgb(209, 10, 156); order: -1;}
     .item6{background-color: rgb(19, 231, 15); order: -2;}

    .items{
        font-size: 20px;
        text-align: center;
        padding: 10px;
        margin: 5px;
    }
</style>
<body>
    <h1>Ayub khan : css order </h1>
    <!-- order is used for that we changed the palace of items -->
    <div class="container">
        <div class="items item1">one</div>
        <div class="items item2">two</div>
        <div class="items item3">three</div>
        <div class="items item4">four</div>
        <div class="items item5">five</div>
        <div class="items item6">six</div>
  
    </div>
</body>

</body>
</html>
