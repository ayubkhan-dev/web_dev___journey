<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        width: 800px;
        height: 400px;
        border: 2px solid red;
        display: flex;
        flex-direction: row;
        
    }
    .box{
        width:100px ;
        height: 100px;
        border: 1px solid red;
        background-color: aqua;
        color: red;
        font-weight: bold;
        font-size: large;
        text-align: center;
        align-content: center;
    }

    @media (max-width:480px){
        .container{
            width: 100%;
            height: 400px;
            display: grid;
            grid-template-rows: 100px 100px 100px 100px;
            grid-template-columns: 50% 50%  ;
        }
        .box{
            width: 100%;
            height: 100px;

        }

    }
    

     @media (min-width:481px) and (max-width:786px){
        .container{
           width: 100%;
           display: grid;
           grid-template-columns: 150px 200px 200px 200px;
           grid-template-rows: 200px 200px;
           
        }
        .box{
            width: 100%;
            height: 200px;
            
        
        
        }

    }
</style>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
</body>
</html>
