<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        width: 800px;
        height: 500px;
        border: 1px solid red;
        position: relative;
    }
     .box{
        width: 100px;
        height: 100px;
        border: 1px solid red;
        background-color: black;
        position: absolute;
        animation-name: box;
        animation-duration: 4s;
        animation-timing-function: ease-in;
    }
    @keyframes box{
       0%{
            top: 0%;
            left: 0%;

        }
        20%{
            top: 0%;
            left: 700px;
            background-color: rgb(233, 27, 12);
        }
        40%{
            top: 400px;
            left: 700px;
            background-color: chartreuse;
        }
         60%{
            top: 400px;
            left: 0px;
            background-color: chartreuse;
        }
         80%{
            top: 0px;
            left: 0px;
            background-color: rgb(233, 23, 177);
        }

         100%{
            top: 400px;
            left: 700px;
            background-color: rgb(18, 246, 132);
        }
       
        


    }

    .ali{
        width: 100px;
        height: 100px;
        background-color: aquamarine;
        transition-property: all;
        transition-duration: 2s;
        /* transition-delay: 1s; */
        transition-timing-function: ease-in;

            
        }
        .ali:hover{
            width: 800px;
            height: 100px;
            background-color: black;
            color: aliceblue;
            text-align: center;
            align-content: center;
            font-size:large ;
            font-weight: bold;
          

        }
        .transform{
            width: 100px;
            height: 100px;
            border: 1px solid red;
            background-color: aqua;
           

        }
        .transform:hover{
            /* transform: rotate(90deg); */
            transform: scale(1.4);
            
        }
</style>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>

    <div class="ali">
        comehere
    </div>

    <div class="transform">
agh 
    </div>
</body>
</html>
