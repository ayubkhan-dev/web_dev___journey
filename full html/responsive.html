<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     .container{
        width: 800px;
        height: 500px;
        border: 1px solid red;
        position: relative;
    }
     .box{
        width: 100px;
        height: 100px;
        border: 1px solid red;
        background-color: black;
        position: absolute;
        animation-name: box;
        animation-duration: 4s;
        animation-timing-function: ease-in;
    }
    @keyframes box{
       0%{
            top: 0%;
            left: 0%;

        }
        20%{
            top: 0%;
            left: 700px;
            background-color: rgb(233, 27, 12);
        }
        40%{
            top: 400px;
            left: 700px;
            background-color: chartreuse;
        }
         60%{
            top: 400px;
            left: 0px;
            background-color: chartreuse;
        }
         80%{
            top: 0px;
            left: 0px;
            background-color: rgb(233, 23, 177);
        }

         100%{
            top: 400px;
            left: 700px;
            background-color: rgb(18, 246, 132);
        }
       
        


    } 
    @media (max-width :480px) {
        .container{
            width: 100%;
            height: 400px;
            background-color: aqua;
            position: relative;
        }
        .box{
            
            width: 20%;
            height: 100px;
            position: absolute;
            animation-name: box;
        animation-duration: 3s;
        animation-timing-function: ease-in;
           
        }
        @keyframes box{
            0%{
                top: 0%;
                left: 0%;

            }
            25%{
                top: 0%;
                left: 80%;
                background-color: red;
            }
             50%{
                top: 300px;
                left: 80%;
                background-color: rgb(103, 233, 22);
            }
            75%{
                top: 300px;
                left: 0%;
                background-color: rgb(11, 72, 240);
            }

            100%{
                top: 0%;
                left: 0%;
                background-color: rgb(202, 20, 230);
            }


            
        }
       
    }
</style>
<body>
      <div class="container">
        <div class="box">

        </div>
    </div>
</body>
</html>
